<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "CSP Final Reflection" }}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap');

    /* ── RESET & GLOBAL OVERRIDES ─────────────────────────────────── */
    body {
      background: #EDE8DF !important;
      color: #000 !important;
      text-shadow: none !important;
      margin: 0;
      padding: 0;
    }
    *, *::before, *::after {
      color: inherit !important;
      text-shadow: none !important;
      list-style-image: none !important;
      background-image: none !important;
      box-sizing: border-box;
    }
    header, .site-header, footer:not(.pg-footer) { display: none !important; }
    a, a:visited, a:hover { color: #000 !important; text-decoration: none; }
    h1, h2, h3, h4, h5, h6 {
      color: #000 !important;
      font-family: 'Playfair Display', Georgia, serif !important;
      border: none !important;
      margin: 0;
    }
    ul, li { list-style: none !important; margin: 0; padding: 0; }
    p { margin: 0; }

    /* ── CALLOUT OVERRIDES (dark boxes — light text) ──────────────── */
    .pg-callout, .pg-callout * { color: #EDE8DF !important; }
    .pg-callout .pg-callout-label { color: #A89880 !important; }
    .pg-callout .pg-callout-body { color: #c0b9ae !important; }
    .pg-callout .pg-callout-tag { color: #d5cfc7 !important; }
    .pg-callout-link, .pg-callout-link:hover { color: #A89880 !important; }

    /* ── WRAPPER ──────────────────────────────────────────────────── */
    .pg {
      font-family: 'Playfair Display', Georgia, serif;
      background: #EDE8DF;
      min-height: 100vh;
    }

    /* ── NAV ──────────────────────────────────────────────────────── */
    .pg-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 4rem;
      border-bottom: 1px solid #D8D1C7;
      background: #EDE8DF;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .pg-nav-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }
    .pg-nav-links {
      display: flex;
      gap: 1.6rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .pg-nav-links a {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(0,0,0,0.55);
      padding: 0.38rem 0.95rem;
      border-radius: 2px;
      transition: background 0.18s, color 0.18s;
    }
    .pg-nav-links a:hover {
      background: #1a1a1a !important;
      color: #EDE8DF !important;
    }

    /* ── HERO ─────────────────────────────────────────────────────── */
    .pg-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      min-height: 88vh;
      border-bottom: 1px solid #D8D1C7;
    }
    .pg-hero-left {
      padding: 5.5rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #D8D1C7;
    }
    .pg-hero-right {
      padding: 5.5rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .pg-hero-eyebrow {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0.5;
    }
    .pg-hero-title {
      font-size: 4rem;
      font-weight: 400;
      line-height: 1.08;
      margin: 0 0 2rem;
      letter-spacing: -0.025em;
    }
    .pg-hero-title em { font-style: italic; }
    .pg-hero-divider {
      width: 40px;
      height: 1px;
      background: #000;
      margin-bottom: 2rem;
    }
    .pg-hero-bio {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.95rem;
      line-height: 1.85;
      color: #3a3a3a;
      max-width: 440px;
    }
    .pg-hero-photo-placeholder {
      width: 100%;
      aspect-ratio: 4/5;
      background: #D8D1C7;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 340px;
    }
    .pg-hero-photo-placeholder span {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.4;
    }
    .pg-hero-photo {
      width: 100%;
      max-width: 340px;
      border-radius: 2px;
      display: block;
    }
    .pg-hero-meta {
      margin-top: 2.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      opacity: 0.45;
    }

    /* ── SECTION WRAPPER ──────────────────────────────────────────── */
    .pg-section {
      padding: 5rem 4rem;
      border-bottom: 1px solid #D8D1C7;
    }
    .pg-section-header {
      display: flex;
      align-items: baseline;
      gap: 2rem;
      margin-bottom: 3rem;
    }
    .pg-section-label {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.45;
      white-space: nowrap;
    }
    .pg-section-rule {
      flex: 1;
      height: 1px;
      background: #D8D1C7;
    }

    /* ── TRIMESTER CALLOUT BOXES ──────────────────────────────────── */
    .pg-callouts {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .pg-callout {
      background: #1c1c1c;
      border-radius: 3px;
      padding: 2.8rem 3.2rem;
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 3rem;
      align-items: start;
    }
    .pg-callout-left {}
    .pg-callout-label {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #A89880 !important;
      margin-bottom: 0.9rem;
      display: block;
    }
    .pg-callout-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 400;
      color: #EDE8DF !important;
      line-height: 1.25;
      margin-bottom: 1.2rem;
    }
    .pg-callout-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .pg-callout-tag {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 0.28rem 0.75rem;
      border-radius: 2px;
      color: #c5bfb7 !important;
    }
    .pg-callout-right {}
    .pg-callout-body {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.9rem;
      line-height: 1.8;
      color: #b8b1a8 !important;
      margin-bottom: 1.4rem;
    }
    .pg-callout-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid #A89880;
      padding: 0.4rem 1.1rem;
      border-radius: 2px;
      color: #A89880 !important;
      transition: background 0.18s;
    }
    .pg-callout-link:hover {
      background: #A89880 !important;
      color: #1c1c1c !important;
    }

    /* ── TOOLS GRID ───────────────────────────────────────────────── */
    .pg-tools-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: 1px solid #D8D1C7;
      border-radius: 3px;
      overflow: hidden;
    }
    .pg-tool {
      padding: 1.6rem 1.4rem;
      border-right: 1px solid #D8D1C7;
      border-bottom: 1px solid #D8D1C7;
      background: #EDE8DF;
      transition: background 0.16s;
      cursor: default;
    }
    .pg-tool:nth-child(5n) { border-right: none; }
    .pg-tool:nth-last-child(-n+5) { border-bottom: none; }
    .pg-tool:hover { background: #E2DBD0; }
    .pg-tool-name {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }
    .pg-tool-desc {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.8rem;
      line-height: 1.55;
      color: #5a5550;
    }

    /* ── CLOSING ──────────────────────────────────────────────────── */
    .pg-closing {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .pg-closing-left {
      padding: 5rem 4rem;
      border-right: 1px solid #D8D1C7;
    }
    .pg-closing-right {
      padding: 5rem 4rem;
    }
    .pg-closing-label {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.45;
      display: block;
      margin-bottom: 1.8rem;
    }
    .pg-closing-quote {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 400;
      font-style: italic;
      line-height: 1.35;
      max-width: 380px;
    }
    .pg-closing-text {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.93rem;
      line-height: 1.85;
      color: #3a3a3a;
    }

    /* ── PAGE FOOTER ──────────────────────────────────────────────── */
    .pg-footer {
      padding: 1.8rem 4rem;
      border-top: 1px solid #D8D1C7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pg-footer span {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      opacity: 0.38;
    }

    /* ── RESPONSIVE ───────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .pg-nav { padding: 1rem 1.5rem; }
      .pg-nav-links { gap: 0.8rem; }
      .pg-hero { grid-template-columns: 1fr; min-height: auto; }
      .pg-hero-left { border-right: none; border-bottom: 1px solid #D8D1C7; padding: 3.5rem 2rem; }
      .pg-hero-right { padding: 3rem 2rem; }
      .pg-hero-title { font-size: 2.6rem; }
      .pg-section { padding: 3.5rem 2rem; }
      .pg-callout { grid-template-columns: 1fr; gap: 1.5rem; padding: 2rem 1.8rem; }
      .pg-tools-grid { grid-template-columns: repeat(2, 1fr); }
      .pg-tool:nth-child(5n) { border-right: 1px solid #D8D1C7; }
      .pg-tool:nth-child(2n) { border-right: none; }
      .pg-tool:nth-last-child(-n+5) { border-bottom: 1px solid #D8D1C7; }
      .pg-tool:nth-last-child(-n+2) { border-bottom: none; }
      .pg-closing { grid-template-columns: 1fr; }
      .pg-closing-left { border-right: none; border-bottom: 1px solid #D8D1C7; padding: 3rem 2rem; }
      .pg-closing-right { padding: 3rem 2rem; }
      .pg-footer { padding: 1.5rem 2rem; }
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
